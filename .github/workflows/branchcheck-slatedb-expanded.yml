name: BranchCheck SlateDB expanded observer fair search

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/ChronicleDB.BranchCheck/**'
      - 'tools/BranchCheck.External/SlateDbProbe/**'
      - 'tests/Research/ChronicleDB.BranchCheck.Tests/**'
      - 'artifacts/external-frozen/slatedb-expanded-preregistration.json'
      - '.github/workflows/branchcheck-slatedb-expanded.yml'

jobs:
  expanded-observer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: buggy
            dependency: 'slatedb = "=0.14.1"'
            target: crate-0.14.1
          - label: fixed
            dependency: 'slatedb = { git = "https://github.com/slatedb/slatedb", rev = "6a131a9ebfd121ca553cb80a08b7b8f2bd142092" }'
            target: fix-6a131a9e
    runs-on: ubuntu-latest
    timeout-minutes: 35
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.301'
      - name: Record Rust toolchain
        run: cargo --version && rustc --version
      - name: Freeze dependency and build observer probe
        env:
          SLATEDB_DEPENDENCY: ${{ matrix.dependency }}
        run: |
          mkdir -p .artifacts/branchcheck
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path('tools/BranchCheck.External/SlateDbProbe/Cargo.toml')
          text = path.read_text()
          if 'slatedb = "=0.14.1"' not in text:
              raise SystemExit('unexpected SlateDB manifest before preregistered substitution')
          text = text.replace('slatedb = "=0.14.1"', os.environ['SLATEDB_DEPENDENCY'])
          path.write_text(text)
          PY
          cargo generate-lockfile --manifest-path tools/BranchCheck.External/SlateDbProbe/Cargo.toml
          cp tools/BranchCheck.External/SlateDbProbe/Cargo.lock .artifacts/branchcheck/slatedb-${{ matrix.label }}-Cargo.lock
          cargo build --locked --manifest-path tools/BranchCheck.External/SlateDbProbe/Cargo.toml
      - name: Run frozen eight-candidate observer fair campaign
        env:
          BRANCHCHECK_SLATEDB_PROBE: ${{ github.workspace }}/tools/BranchCheck.External/SlateDbProbe/target/debug/branchcheck-slatedb-probe
          SLATEDB_PROBE_TARGET: ${{ matrix.target }}
        run: |
          set -o pipefail
          dotnet run -c Release --project tools/ChronicleDB.BranchCheck -- slatedb-expanded-budget \
            | tee .artifacts/branchcheck/slatedb-expanded-${{ matrix.label }}.json
      - name: Assert grammar identity and preserve all observer outcomes
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('.artifacts/branchcheck/slatedb-expanded-${{ matrix.label }}.json').read_text())['Report']
          assert report['CandidateSetFingerprint'] == 'F4A32481242FCC67B57309D73F0641EA14C7B5E65B161A26EB2FB34640DF5220', report
          assert len(report['Candidates']) == 8, report
          assert report['DependencyRelevantCandidateCount'] == 3, report
          assert len({row['Candidate'] for row in report['Candidates']}) == 8, report
          print(json.dumps({
              'backend_version': report['BackendVersion'],
              'violations': report['ViolationCandidateCount'],
              'dependency_relevant': report['DependencyRelevantCandidateCount'],
              'curve': report['BudgetCurve'],
          }, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: branchcheck-slatedb-expanded-${{ matrix.label }}
          path: .artifacts/branchcheck

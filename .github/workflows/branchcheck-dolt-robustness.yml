name: BranchCheck Dolt robustness and causal sweep

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/ChronicleDB.BranchCheck/DoltCloneContinuationSmokeProbe.cs'
      - '.github/workflows/branchcheck-dolt-robustness.yml'

jobs:
  robustness:
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        delay_ms: [0, 1, 5, 10, 50, 100, 500]
        include:
          - label: dolt-223
            kind: release
            version: 2.2.3
            sha256: ffafa7cc172cada5f77ca3fb96306545ddac44a111625f75f870306c7f197301
          - label: dolt-230
            kind: release
            version: 2.3.0
            sha256: f702aa9fc4246b076e6e255f5bb6eb6f0a120962ab8895dda9e77a0a77cfe10d
          - label: dolt-main-unpatched
            kind: current
            causal: unpatched
          - label: dolt-main-background
            kind: current
            causal: background
          - label: dolt-main-without-cancel
            kind: current
            causal: without-cancel
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.301'
      - uses: actions/setup-go@v6
        if: matrix.kind == 'current'
        with:
          go-version: '1.26.2'
          cache: false
      - name: Install pinned release Dolt
        if: matrix.kind == 'release'
        run: |
          mkdir -p /tmp/branchcheck-dolt/${{ matrix.version }} .artifacts/branchcheck
          curl -L --fail --retry 3 \
            https://github.com/dolthub/dolt/releases/download/v${{ matrix.version }}/dolt-linux-amd64.tar.gz \
            -o /tmp/branchcheck-dolt/${{ matrix.version }}/dolt.tar.gz
          echo '${{ matrix.sha256 }}  /tmp/branchcheck-dolt/${{ matrix.version }}/dolt.tar.gz' | sha256sum -c -
          tar -xzf /tmp/branchcheck-dolt/${{ matrix.version }}/dolt.tar.gz -C /tmp/branchcheck-dolt/${{ matrix.version }}
          DOLT_BIN="$(find /tmp/branchcheck-dolt/${{ matrix.version }} -type f -name dolt -perm -u+x | head -n 1)"
          test -n "$DOLT_BIN"
          echo "BRANCHCHECK_DOLT=$DOLT_BIN" >> "$GITHUB_ENV"
          "$DOLT_BIN" version | tee .artifacts/branchcheck/dolt-version.txt
      - name: Fetch pinned current Dolt source
        if: matrix.kind == 'current'
        run: |
          git init /tmp/dolt-main
          git -C /tmp/dolt-main remote add origin https://github.com/dolthub/dolt.git
          git -C /tmp/dolt-main fetch --depth=1 origin c3b5ce3c67f8677ca08a0a58d8c03cdc95bff8b7
          git -C /tmp/dolt-main checkout --detach FETCH_HEAD
          test "$(git -C /tmp/dolt-main rev-parse HEAD)" = 'c3b5ce3c67f8677ca08a0a58d8c03cdc95bff8b7'
      - name: Apply preregistered causal variant
        if: matrix.kind == 'current' && matrix.causal != 'unpatched'
        env:
          CAUSAL_VARIANT: ${{ matrix.causal }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path('/tmp/dolt-main/go/libraries/doltcore/sqle/dsess/sequence_tracker.go')
          text = path.read_text()
          old = 'gcSafepointController := getGCSafepointController(ctx)\n\tif gcSafepointController != nil {'
          variant = os.environ['CAUSAL_VARIANT']
          replacement = {
              'background': 'gcSafepointController := getGCSafepointController(ctx)\n\tctx = context.Background()\n\tif gcSafepointController != nil {',
              'without-cancel': 'gcSafepointController := getGCSafepointController(ctx)\n\tctx = context.WithoutCancel(ctx)\n\tif gcSafepointController != nil {'
          }[variant]
          if old not in text:
              raise SystemExit('expected SequenceTracker constructor pattern not found')
          path.write_text(text.replace(old, replacement, 1))
          PY
      - name: Build current Dolt variant
        if: matrix.kind == 'current'
        working-directory: /tmp/dolt-main/go
        run: |
          go build -o /tmp/dolt-main-bin ./cmd/dolt
          echo 'BRANCHCHECK_DOLT=/tmp/dolt-main-bin' >> "$GITHUB_ENV"
          /tmp/dolt-main-bin version | tee "$GITHUB_WORKSPACE/dolt-main-version.txt"
      - name: Build BranchCheck
        run: dotnet build -c Release tools/ChronicleDB.BranchCheck/ChronicleDB.BranchCheck.csproj
      - name: Run one-hundred fresh repetitions
        env:
          BRANCHCHECK_DOLT_CONTINUATION_DELAY_MS: ${{ matrix.delay_ms }}
        run: |
          set -u
          root=".artifacts/branchcheck/${{ matrix.label }}/delay-${{ matrix.delay_ms }}ms"
          mkdir -p "$root"
          for i in $(seq 1 100); do
            output="$root/${i}.json"
            error="$root/${i}.stderr"
            if BRANCHCHECK_DOLT="$BRANCHCHECK_DOLT" dotnet run -c Release --no-build --project tools/ChronicleDB.BranchCheck -- dolt-clone-smoke > "$output" 2> "$error"; then
              :
            else
              python3 - "$output" "$error" "$i" <<'PY'
          import json
          import sys
          from pathlib import Path
          output, error, run_id = sys.argv[1:]
          Path(output).write_text(json.dumps({
              'Mode': 'dolt-clone-smoke',
              'RunId': int(run_id),
              'HarnessFailure': True,
              'Error': Path(error).read_text(),
          }, indent=2, sort_keys=True))
          PY
            fi
          done
      - name: Aggregate robustness outcomes
        run: |
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          root = Path('.artifacts/branchcheck/${{ matrix.label }}/delay-${{ matrix.delay_ms }}ms')
          files = sorted(root.glob('*.json'), key=lambda path: int(path.stem))
          rows = [json.loads(path.read_text()) for path in files]
          reports = [row['Report'] for row in rows if 'Report' in row]
          summary = {
              'target': '${{ matrix.label }}',
              'delay_ms': int('${{ matrix.delay_ms }}'),
              'runs': len(rows),
              'report_runs': len(reports),
              'harness_failures': sum(1 for row in rows if row.get('HarnessFailure')),
              'outcomes': dict(Counter(report['ContinuationOutcome'] for report in reports)),
              'relations': dict(Counter(report['ContinuationRelation'] for report in reports)),
              'generated_ids': dict(Counter(str(report.get('GeneratedId')) for report in reports)),
              'server_health': dict(Counter(report.get('ServerProcessHealth') for report in reports)),
              'elapsed_ms': {
                  'min': min((report['ElapsedMilliseconds'] for report in reports), default=None),
                  'median': sorted(report['ElapsedMilliseconds'] for report in reports)[len(reports) // 2] if reports else None,
                  'max': max((report['ElapsedMilliseconds'] for report in reports), default=None),
              },
          }
          (root / 'summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True))
          print(json.dumps(summary, indent=2, sort_keys=True))
          assert summary['runs'] == 100, summary
          assert summary['report_runs'] + summary['harness_failures'] == 100, summary
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: branchcheck-dolt-robustness-${{ matrix.label }}-${{ matrix.delay_ms }}ms
          path: .artifacts/branchcheck

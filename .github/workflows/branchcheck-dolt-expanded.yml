name: BranchCheck Dolt expanded fair search

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/ChronicleDB.BranchCheck/**'
      - 'tests/Research/ChronicleDB.BranchCheck.Tests/**'
      - 'artifacts/external-frozen/dolt-expanded-preregistration.json'
      - '.github/workflows/branchcheck-dolt-expanded.yml'

jobs:
  expanded-budget:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 223
            version: 2.2.3
            sha256: ffafa7cc172cada5f77ca3fb96306545ddac44a111625f75f870306c7f197301
          - label: 230
            version: 2.3.0
            sha256: f702aa9fc4246b076e6e255f5bb6eb6f0a120962ab8895dda9e77a0a77cfe10d
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.301'
      - name: Install pinned Dolt ${{ matrix.version }}
        run: |
          mkdir -p .artifacts/branchcheck /tmp/branchcheck-dolt/${{ matrix.version }}
          curl -L --fail --retry 3 \
            https://github.com/dolthub/dolt/releases/download/v${{ matrix.version }}/dolt-linux-amd64.tar.gz \
            -o /tmp/branchcheck-dolt/${{ matrix.version }}/dolt.tar.gz
          echo '${{ matrix.sha256 }}  /tmp/branchcheck-dolt/${{ matrix.version }}/dolt.tar.gz' | sha256sum -c -
          tar -xzf /tmp/branchcheck-dolt/${{ matrix.version }}/dolt.tar.gz -C /tmp/branchcheck-dolt/${{ matrix.version }}
          DOLT_BIN="$(find /tmp/branchcheck-dolt/${{ matrix.version }} -type f -name dolt -perm -u+x | head -n 1)"
          test -n "$DOLT_BIN"
          echo "BRANCHCHECK_DOLT=$DOLT_BIN" >> "$GITHUB_ENV"
          "$DOLT_BIN" version | tee .artifacts/branchcheck/dolt-${{ matrix.label }}-version.txt
      - name: Build BranchCheck
        run: dotnet build -c Release tools/ChronicleDB.BranchCheck/ChronicleDB.BranchCheck.csproj
      - name: Run frozen ten-candidate fair campaign
        run: |
          set -o pipefail
          dotnet run -c Release --project tools/ChronicleDB.BranchCheck -- dolt-expanded-budget \
            | tee .artifacts/branchcheck/dolt-expanded-${{ matrix.label }}.json
      - name: Assert grammar identity and retain all outcomes
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('.artifacts/branchcheck/dolt-expanded-${{ matrix.label }}.json').read_text())['Report']
          assert report['CandidateSetFingerprint'] == '51C8F5284EF8E58C226F003ACA0D91701FBFEDB6B4086C25ECA8319D0F73E40B', report
          assert report['Recipes'] and len(report['Recipes']) == 10, report
          assert report['SequenceRelevantRecipeCount'] == 6, report
          assert len({row['Recipe'] for row in report['Recipes']}) == 10, report
          print(json.dumps({
              'backend_version': report['BackendVersion'],
              'candidate_count': report['Recipes'].__len__(),
              'violations': report['ViolationRecipeCount'],
              'sequence_relevant': report['SequenceRelevantRecipeCount'],
              'curve': report['BudgetCurve'],
          }, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: branchcheck-dolt-expanded-${{ matrix.label }}
          path: .artifacts/branchcheck
